[defaults]
# Use YAML format for the stdout callback result
callback_result_format = yaml
# Disable SSH host key checking (hosts are ephemeral/frequently rebuilt)
host_key_checking = False
# Use the callback plugin when running ad-hoc commands
bin_ansible_callbacks = True
# Disable fact variable injection to improve performance.
inject_facts_as_vars = False

[ssh_connection]
pipelining = True
