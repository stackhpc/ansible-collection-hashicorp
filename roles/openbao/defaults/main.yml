---
openbao_registry_url: ""
openbao_registry_username: ""
openbao_registry_password: ""

openbao_docker_name: "openbao"
openbao_docker_image: "openbao/openbao"
openbao_docker_tag: "latest"

openbao_config_dir: ""

openbao_cluster_name: ""

openbao_tls_key: ""
openbao_tls_cert: ""
openbao_tls_ca: ""

openbao_protocol: "{{ 'https' if openbao_tls_key and openbao_tls_cert else 'http' }}"

openbao_api_addr: "{{ openbao_bind_addr ~ ':' ~ openbao_api_port }}"
openbao_bind_addr: "127.0.0.1"
openbao_init_addr: "{{ openbao_api_addr }}"
openbao_cluster_addr: "{{ openbao_bind_addr ~ ':' ~ openbao_cluster_port }}"

openbao_api_port: 8200
openbao_cluster_port: 8201

openbao_raft_leaders: []

# The value openbao.yml's docker_container/storage.raft config actually
# consumes. discover.yml only ever overrides THIS (via set_fact) when it
# auto-discovers a join target - it never touches openbao_raft_leaders
# itself, so that caller-facing input stays stable across multiple
# include_role calls in the same play and discovery always re-runs cleanly.
_openbao_effective_raft_leaders: "{{ openbao_raft_leaders }}"

# Inventory group containing every host that should end up in this OpenBao
# raft cluster. When set, and openbao_raft_leaders is left at its default,
# the role verifies the current play targets every host in this group before
# attempting cluster auto-discovery (see discover.yml) - a partial run (e.g.
# via --limit) can't safely decide who the leader/join target is. Defaults
# to "bao", the inventory group name this collection's deployments use in
# practice; set to "" to disable the check, or override for a different
# group name.
openbao_cluster_group: "bao"

openbao_enable_ui: false
openbao_unauthenticated_metrics_access: true

_openbao_listener_tls:
  - tcp:
      address: "{{ openbao_bind_addr ~ ':' ~ openbao_api_port }}"
      telemetry:
        unauthenticated_metrics_access: "{{ openbao_unauthenticated_metrics_access | bool }}"
      tls_min_version: "tls12"
      tls_key_file: "{{ '/openbao/config/' ~ openbao_tls_key }}"
      tls_cert_file: "{{ '/openbao/config/' ~ openbao_tls_cert }}"

_openbao_listener_no_tls:
  - tcp:
      address: "{{ openbao_bind_addr ~ ':' ~ openbao_api_port }}"
      telemetry:
        unauthenticated_metrics_access: "{{ openbao_unauthenticated_metrics_access | bool }}"
      tls_disable: "true"

_openbao_listener_local:
  - tcp:
      address: '127.0.0.1:8200'
      tls_disable: 'true'

_openbao_retry_join_base:
  leader_api_addr: "{{ openbao_protocol ~ '://' ~ (_openbao_effective_raft_leaders | default(['']) | first) ~ ':' ~ openbao_api_port }}"

_openbao_retry_join_tls:
  leader_ca_cert_file: "{{ '/openbao/config/' ~ openbao_tls_ca }}"

_openbao_retry_join:
  retry_join: "{{ _openbao_retry_join_base | combine(_openbao_retry_join_tls if openbao_tls_ca else {}) }}"

_openbao_raft_config:
  node_id: "raft_{{ inventory_hostname }}"
  path: "/openbao/file"

openbao_config:
  cluster_name: "{{ openbao_cluster_name }}"
  ui: "{{ openbao_enable_ui }}"
  api_addr: "{{ openbao_api_addr }}"
  cluster_addr: "{{ openbao_protocol }}://{{ openbao_cluster_addr }}"
  listener: "{{ (_openbao_listener_tls if (openbao_tls_key and openbao_tls_cert) else _openbao_listener_no_tls) +
                (_openbao_listener_local if not openbao_bind_addr.startswith('127.') else []) }}"
  storage:
    raft: "{{ _openbao_raft_config | combine(_openbao_retry_join if _openbao_effective_raft_leaders | length > 0 else {}) }}"
  telemetry:
    prometheus_retention_time: "30s"
    disable_hostname: true

# Docker options
openbao_container: {}

# Docker volumes
# Default volume mapping
_openbao_default_volumes:
  - "{{ openbao_config_dir | default('openbao_config', true) }}:/openbao/config"
  - "openbao_file:/openbao/file"
  - "openbao_logs:/openbao/logs"

# Exposed for playbooks to access later
openbao_extra_volumes: []

# Combined volume lists
_openbao_volumes: "{{ _openbao_default_volumes + openbao_extra_volumes }}"

# Whether to log the root token and unseal keys in the Ansible output.
openbao_log_keys: false

# Whether to set a openbao_keys fact containing the root token and unseal keys.
openbao_set_keys_fact: false

# Whether to write the root token and unseal keys to a file.
openbao_write_keys_file: false
# Host on which to write root token and unseal keys.
openbao_write_keys_file_host: localhost
# Path of file to write root token and unseal keys.
openbao_write_keys_file_path: bao-keys.json
