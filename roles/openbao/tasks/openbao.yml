---
- name: Get OpenBao user id and group id
  community.docker.docker_container:
    name: "openbao_uid_check"
    image: "{{ openbao_docker_image }}:{{ openbao_docker_tag }}"
    command: "id openbao"
    detach: false
    cleanup: true
  register: id_openbao_result
  become: true
  run_once: true

- name: Set OpenBao user id and group id
  ansible.builtin.set_fact:
    openbao_uid: "{{ id_openbao_result.container.Output | regex_search('uid=(\\d+)', '\\1') | first }}"
    openbao_gid: "{{ id_openbao_result.container.Output | regex_search('gid=(\\d+)', '\\1') | first }}"

- name: Ensure Openbao directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0770"
    owner: "{{ openbao_uid }}"
    group: "{{ openbao_gid }}"
  become: true
  loop:
    - "{{ openbao_config_dir }}"
    - "{{ openbao_config_dir }}/config"
    - "{{ openbao_config_dir }}/openbao_file"
    - "{{ openbao_config_dir }}/openbao_logs"

- name: Ensure OpenBao container is running
  docker_container:
    name: "{{ openbao_docker_name }}"
    image: "{{ openbao_docker_image }}:{{ openbao_docker_tag }}"
    network_mode: host
    etc_hosts: "{{ openbao_container.etc_hosts | default(omit) }}"
    capabilities: IPC_LOCK
    volumes: "{{ _openbao_volumes }}"
    comparisons:
      '*': strict
    restart_policy: "always"
    env:
      BAO_LOCAL_CONFIG: "{{ openbao_config | to_json }}"
      BAO_ADDR: "{{ openbao_api_addr }}"
    command: >
      server
  become: true
  register: _openbao_container_deploy

# Skipped when discover.yml already confirmed (via /v1/sys/health) that this
# host was an initialized cluster member *and* the container above didn't
# change - in that case the fact is still trustworthy and re-polling
# /v1/sys/init would just be a redundant round trip. Otherwise (a manual
# openbao_raft_leaders override where discover.yml never ran, a host that
# wasn't initialized before, or a container that just got (re)created) this
# always re-checks, since a pre-mutation fact can't be trusted post-mutation.
- name: Check if OpenBao is initialized
  uri:
    url: "{{ openbao_init_addr }}/v1/sys/init"
  register: openbao_init_status
  retries: 50
  delay: 1
  run_once: true
  until: openbao_init_status.status == 200
  when: >-
    not (_openbao_node_state is defined and _openbao_node_state.initialized
         and not _openbao_container_deploy.changed)

- name: "Initialize OpenBao"
  run_once: true
  when:
    - openbao_init_status is not skipped
    - not openbao_init_status.json.initialized
  block:
    - name: Initialize OpenBao
      hashivault_init:
        url: "{{ openbao_init_addr }}"
        ca_cert: "{{ openbao_ca_cert | default(omit) }}"
      no_log: true
      register: openbao_keys_result

    - name: Print OpenBao keys
      debug:
        var: openbao_keys_result
      when:
        - openbao_log_keys | bool

    - name: Set openbao_keys fact
      set_fact:
        openbao_keys: "{{ openbao_keys_result }}"
      when:
        - openbao_set_keys_fact | bool

    - name: Write OpenBao keys to a file
      copy:
        content: "{{ openbao_keys_result | to_nice_json }}"
        dest: "{{ openbao_write_keys_file_path }}"
        mode: "0600"
      delegate_to: "{{ openbao_write_keys_file_host }}"
      when:
        - openbao_write_keys_file | bool
